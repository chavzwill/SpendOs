name: SpendOS TT AI contract quality gate

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/spendos-ci.yml"

permissions:
  contents: read

concurrency:
  group: spendos-draft-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Static checks, finance guards and TT AI client integration tests
        run: npm run check
